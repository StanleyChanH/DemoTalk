<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DemoTalk · 实时语音助手</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <span class="mark-core"></span>
        </span>
        <div class="brand-text">
          <h1 class="brand-name">DemoTalk</h1>
          <span class="brand-sub">实时语音助手 · 百炼 STT / LLM / TTS</span>
        </div>
      </div>
      <div class="status">
        <button id="btnSettings" class="icon-btn" aria-label="设置" title="设置">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="currentColor" d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm9.3 3.2-2.1-.5a7.8 7.8 0 0 0-.5-1.3l1.1-1.8a.6.6 0 0 0-.1-.8l-1.7-1.7a.6.6 0 0 0-.8-.1l-1.8 1.1a7.8 7.8 0 0 0-1.3-.5l-.5-2.1a.6.6 0 0 0-.6-.5h-2.4a.6.6 0 0 0-.6.5l-.5 2.1a7.8 7.8 0 0 0-1.3.5L7.7 4.3a.6.6 0 0 0-.8.1L5.2 6.1a.6.6 0 0 0-.1.8l1.1 1.8a7.8 7.8 0 0 0-.5 1.3l-2.1.5a.6.6 0 0 0-.5.6v2.4c0 .3.2.5.5.6l2.1.5c.1.5.3.9.5 1.3l-1.1 1.8c-.2.3-.1.6.1.8l1.7 1.7c.2.2.5.2.8.1l1.8-1.1c.4.2.8.4 1.3.5l.5 2.1c.1.3.3.5.6.5h2.4c.3 0 .5-.2.6-.5l.5-2.1c.5-.1.9-.3 1.3-.5l1.8 1.1c.3.2.6.1.8-.1l1.7-1.7c.2-.2.2-.5.1-.8l-1.1-1.8c.2-.4.4-.8.5-1.3l2.1-.5a.6.6 0 0 0 .5-.6v-2.4a.6.6 0 0 0-.4-.6z"/>
          </svg>
        </button>
        <span id="connPill" class="pill pill-muted">未连接</span>
        <span id="statePill" class="pill">待机</span>
      </div>
    </header>

    <div class="stage">
      <!-- 左：聊天 -->
      <section class="chat-col panel">
        <main id="transcript" class="transcript">
          <div class="hint" id="welcome">
            <span class="hint-eyebrow">开始对话</span>
            点击下方「开始对话」，允许麦克风权限后即可开口交谈。<br />
            助手会实时转写你的话、流式生成回答（打字机效果）并语音播报。
          </div>
        </main>
        <div id="partial" class="partial" aria-live="polite"></div>
      </section>

      <!-- 右：摄像头（助手的眼睛） -->
      <aside class="cam-col">
        <div class="cam-stage">
          <div class="cam-placeholder">
            <div class="reticle" aria-hidden="true">
              <span></span><span></span><span></span>
            </div>
            <p class="cam-wait-line">摄像头待机</p>
            <p class="cam-wait-sub">开始对话后，这里会成为助手的眼睛</p>
          </div>
          <video id="camView" class="hidden" autoplay muted playsinline></video>
          <span class="corner tl"></span>
          <span class="corner tr"></span>
          <span class="corner bl"></span>
          <span class="corner br"></span>
          <div class="cam-badge">取景中</div>
          <span id="vadIndicator" class="vad-indicator" title="语音检测"></span>
        </div>
      </aside>
    </div>

    <footer class="controls">
      <button id="btnStart" class="btn btn-primary">
        <span class="btn-dot"></span>开始对话
      </button>
      <button id="btnStop" class="btn btn-ghost" disabled>结束对话</button>
      <span id="hint" class="hint-small"></span>
    </footer>
  </div>

  <div id="settingsPanel" class="settings-panel hidden" role="dialog" aria-label="设置">
    <div class="settings-head">
      <span>设置</span>
      <button id="btnCloseSettings" class="icon-btn sm" aria-label="关闭">×</button>
    </div>
    <div class="toggle-row" data-flag="barge_in">
      <div class="toggle-info">
        <div class="toggle-label">允许打断</div>
        <div class="toggle-desc">助手说话时你开口，立即停止并进入新一轮</div>
      </div>
      <button class="switch" role="switch" aria-checked="true" aria-label="允许打断"></button>
    </div>
    <div class="toggle-row" data-flag="mcp">
      <div class="toggle-info">
        <div class="toggle-label">MCP 工具</div>
        <div class="toggle-desc">允许助手调用外部工具服务器</div>
      </div>
      <button class="switch" role="switch" aria-checked="true" aria-label="MCP 工具"></button>
    </div>
    <div class="toggle-row" data-flag="end_by_voice">
      <div class="toggle-info">
        <div class="toggle-label">语义结束</div>
        <div class="toggle-desc">说「再见」等，由助手自动结束对话</div>
      </div>
      <button class="switch" role="switch" aria-checked="true" aria-label="语义结束"></button>
    </div>
    <div class="toggle-row" data-flag="idle_timeout">
      <div class="toggle-info">
        <div class="toggle-label">空闲超时</div>
        <div class="toggle-desc">长时间不说话自动结束对话（默认 15 秒）</div>
      </div>
      <button class="switch" role="switch" aria-checked="true" aria-label="空闲超时"></button>
    </div>
    <div class="toggle-row slider-row">
      <div class="toggle-info">
        <div class="toggle-label">麦克风灵敏度</div>
        <div class="toggle-desc">值越大越易触发；背景噪声多则调低</div>
      </div>
      <div class="slider-wrap">
        <input id="vadRange" class="vad-range" type="range" min="0" max="100" value="50" aria-label="麦克风灵敏度" />
        <span id="vadRangeVal" class="vad-range-val">50</span>
      </div>
    </div>
    <div class="settings-foot">默认值来自 .env，切换后立即生效</div>
  </div>

  <div id="flash"></div>
  <script src="/config.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
