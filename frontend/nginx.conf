# DemoTalk 前端 nginx 配置：纯静态托管（无 WS 反代；浏览器直连后端容器）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 静态资源（app.js / style.css / vad/）：直接返回，不存在的 404
    location /static/ {
        try_files $uri =404;
    }

    # config.js 由 entrypoint.sh 启动时生成（注入 window.DEMOTALK_WS_URL）
    # 其余路径兜底回 index.html（SPA 风格）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
