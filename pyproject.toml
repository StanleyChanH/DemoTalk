[project]
name = "demotalk"
version = "0.1.0"
description = "实时低延迟语音助手（阿里云百炼 STT/LLM/TTS）"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "dashscope>=1.25.11",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "websockets<14",
]

[project.scripts]
demotalk = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
